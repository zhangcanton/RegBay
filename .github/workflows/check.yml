name: R

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: 
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        r-version: ['4.0', '4.1', '4.2', '4.3', 'release']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.r-version }}
      
      - name: Run script
        run: Rscript -e "source('R/helper_functions.R'); env_check()"
